<script>

   2) Cole abaixo a Project URL e a Publishable key (sb_publishable_...), em Project Settings > API Keys.

   Enquanto estiverem vazias, tudo fica só neste navegador (modo protótipo). */
const SUPABASE_URL = 'https://wjrgujdsjltfdxuuopow.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AsJ8wR8qNrVWYNXVhhBMkA_C-y-gMR_';

    { id: 'demo2', code: 'DEMO-002', name: 'Jaqueta (demonstrativo)', desc: 'Produto de exemplo indisponível.', price: 249.9, promo: 0, cat: 'j', sub: '', color: 'Preto', sizes: ['M', 'G'], available: false, active: true, images: [], payLink: '', pixQr: '', info: '', tags: [] }

const toBlob = (file, max = 1000) => new Promise((res, rej) => {
  const im = new Image(), u = URL.createObjectURL(file);
  im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);

});
const toDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
const LocalAdapter = {
  async load() { try { return JSON.parse(localStorage.getItem('blessduo')); } catch { return null; } },
  async save(d) { localStorage.setItem('blessduo', JSON.stringify(d)); },
  async uploadImage(file) { return toDataURL(await toBlob(file)); }
};
const SupabaseAdapter = {
  h: (x = {}) => ({ apikey: SUPABASE_KEY, ...(SUPABASE_KEY.startsWith('eyJ') ? { Authorization: 'Bearer ' + SUPABASE_KEY } : {}), ...x }),
  async load() {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/store?id=eq.main&select=data`, { headers: SupabaseAdapter.h() });

  async save(d, pass) { const { orders, ...x } = d; await rpc('save_store', { p_pass: pass, p_data: { ...x, settings: { ...x.settings, adminPass: undefined } } }); },
  async uploadImage(file) {
    const b = await toBlob(file, 1400), name = `${Date.now()}-${Math.random().toString(36).slice(2, 7)}.webp`;
    try {
      const r = await fetch(`${SUPABASE_URL}/storage/v1/object/images/${name}`, { method: 'POST', headers: SupabaseAdapter.h({ 'Content-Type': 'image/webp' }), body: b });

  }

const useSB = () => !!(SUPABASE_URL && SUPABASE_KEY);
const rpc = async (fn, args) => {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: SupabaseAdapter.h({ 'Content-Type': 'application/json' }), body: JSON.stringify(args) });

  failed: false,
  async load() {

function fld(f, v) {
  const L = `<label class="fld"><span>${f.l}</span>`;
  if (f.t === 'area') return L + `<textarea data-k="${f.k}">${esc(v)}</textarea></label>`;
  if (f.t === 'sel') return L + `<select data-k="${f.k}">${f.o.map(o => { const [a, b] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(a)}" ${a == v ? 'selected' : ''}>${esc(b)}</option>`; }).join('')}</select></label>`;
  if (f.t === 'chk') return `<label class="fld chk"><input type="checkbox" data-k="${f.k}" ${v ? 'checked' : ''}><span>${f.l}</span></label>`;
  if (f.t === 'multi') return `<div class="fld"><span>${f.l}</span><div class="sz">${f.o.map(s => `<label><input type="checkbox" data-m="${f.k}" value="${s}" ${(v || []).includes(s) ? 'checked' : ''}><i>${s}</i></label>`).join('')}</div></div>`;
  if (f.t === 'img' || f.t === 'imgs') return `<div class="fld"><span>${f.l}</span><div class="imgs" data-img="${f.k}"></div></div>`;
  return L + `<input data-k="${f.k}" type="${f.t || 'text'}" ${f.t === 'number' ? 'step="0.01" min="0"' : ''} ${f.t === 'range' ? `min="${f.min}" max="${f.max}"` : ''} value="${esc(v)}"></label>`;

  });

    if (e.target.type !== 'file') return sync(); const k = e.target.closest('[data-img]').dataset.img;
    for (const f of e.target.files) { try { const u = await Store.uploadImage(f); Array.isArray(W[k]) ? W[k].push(u) : (W[k] = u); } catch { toast('Imagem inválida', 'err'); } }

    fields.forEach(f => {
      if (f.t === 'img' || f.t === 'imgs') return;
      if (f.t === 'multi') return W[f.k] = $$(`[data-m="${f.k}"]:checked`, mount).map(x => x.value);
      const el = $(`[data-k="${f.k}"]`, mount);
      W[f.k] = f.t === 'chk' ? el.checked : (f.t === 'number' || f.t === 'range') ? parseFloat(el.value) || 0 : el.value.trim();
    });
  };
  const sync = () => { if (live) { read(); live(W); } };
  EDIT = () => { read(); onSave(W); };
  mount.oninput = e => { if (e.target.type !== 'file') sync(); };
}
const FIELDS = {
  hero: [{ k: 'heroImg', l: 'Imagem principal', t: 'img' }, { k: 'heroTitle', l: 'Título' }, { k: 'heroSub', l: 'Subtítulo' }, { k: 'heroText', l: 'Texto promocional' }, { k: 'heroBtn', l: 'Texto do botão' }],
  wa: [{ k: 'whatsapp', l: 'WhatsApp da loja (com DDD, ex.: 55 11 90000-0000)' }, ...(useSB() ? [] : [{ k: 'adminPass', l: 'Senha do painel (apenas protótipo)' }])],
  foot: [{ k: 'brand', l: 'Nome da loja' }, { k: 'logo', l: 'Logo', t: 'img' }, { k: 'about', l: 'Texto da empresa', t: 'area' }, { k: 'showMap', l: 'Mostrar localização no site (endereço e mapa)', t: 'chk' }, { k: 'address', l: 'Endereço' }, { k: 'phone', l: 'Telefone' }, { k: 'instagram', l: 'Instagram (@usuario ou link)' }, { k: 'maps', l: 'Link do Google Maps' }, { k: 'links', l: 'Outros links (um por linha: Nome|https://...)', t: 'area' }, { k: 'seoDesc', l: 'Descrição para buscadores (SEO)', t: 'area' }],
  look: [{ k: 'bg', l: 'Cor de fundo', t: 'color' }, { k: 'fg', l: 'Cor do texto', t: 'color' }, { k: 'btn', l: 'Cor dos botões', t: 'color' }, { k: 'btnText', l: 'Cor do texto dos botões', t: 'color' }, { k: 'font', l: 'Fonte', t: 'sel', o: FONTS }, { k: 'fontSize', l: 'Tamanho do texto (px)', t: 'range', min: 14, max: 20 }, { k: 'radius', l: 'Arredondamento (px)', t: 'range', min: 6, max: 36 }, { k: 'blur', l: 'Intensidade do blur (px)', t: 'range', min: 0, max: 40 }]
};
const prodFields = () => [{ k: 'name', l: 'Nome' }, { k: 'code', l: 'Código' }, { k: 'desc', l: 'Descrição', t: 'area' }, { k: 'price', l: 'Preço original (R$)', t: 'number' }, { k: 'promo', l: 'Preço promocional (R$, 0 = sem promoção)', t: 'number' },
  { k: 'cat', l: 'Categoria', t: 'sel', o: S.categories.map(c => [c.id, c.name]) }, { k: 'sub', l: 'Subcategoria' }, { k: 'color', l: 'Cor (várias separadas por vírgula)' }, { k: 'sizes', l: 'Tamanhos', t: 'multi', o: SIZES },
  { k: 'images', l: 'Fotos', t: 'imgs' }, { k: 'info', l: 'Informação adicional', t: 'area' },
  { k: 'tags', l: 'Seções', t: 'multi', o: ['Novidade', 'Mais vendido', 'Destaque'] }, { k: 'available', l: 'Disponível para compra', t: 'chk' }, { k: 'active', l: 'Visível na loja', t: 'chk' }];
const NEWP = () => ({ id: '', code: '', name: '', desc: '', price: 0, promo: 0, cat: (S.categories[0] || {}).id || '', sub: '', color: '', sizes: [], available: true, active: true, images: [], payLink: '', pixQr: '', info: '', tags: [] });
const TABS = [['dash', 'Dashboard'], ['prod', 'Produtos'], ['cat', 'Categorias'], ['ord', 'Pedidos'], ['hero', 'Página inicial'], ['wa', 'WhatsApp'], ['foot', 'Rodapé'], ['look', 'Aparência']];
const PREV = '<div class="prev"><span class="o1"></span><span class="o2"></span><div class="glass pv">Prévia do Liquid Glass</div></div>';
function openAdmin() { DIRTY = false; ADM = true; $('#admin').classList.add('on'); document.body.classList.add('lock'); closeAll(); document.body.classList.add('lock'); adm('dash'); }
async function loadOrders() {
  const ab = $('#ab'); let o = [];
  try { o = await Store.listOrders(ADMPASS); } catch { ab.innerHTML = '<h2>Pedidos</h2><p class="empty">Não foi possível carregar os pedidos.</p>'; return; }
  if (ATAB !== 'ord') return;
  ab.innerHTML = '<h2>Pedidos</h2><p class="mut">Os valores abaixo foram registrados na hora da compra. Confira com eles, e não com o que aparece digitado no WhatsApp.</p>' + (o.map(x => `<div class="item" style="display:block"><b>#${esc(x.code || String(x.id).slice(0, 6).toUpperCase())} · ${esc(x.name)}</b> — ${brl(x.total)} <span class="mut">${new Date(x.created || x.date).toLocaleString('pt-BR')}</span>${x.address ? `<p class="mut">Endereço: ${esc(x.address)}</p>` : ''}${x.items.map(i => `<p class="mut">${i.qty}× ${esc(i.name)} · ${esc(i.color || '-')} · ${esc(i.size)} · ${brl(i.price)} cada = ${brl(i.price * i.qty)}</p>`).join('')}${x.notes ? `<p class="mut">Obs: ${esc(x.notes)}</p>` : ''}<div class="row"><select data-ost="${esc(x.id)}" style="background:#111;border-radius:999px;padding:8px 14px;border:1px solid var(--line)">${['Novo', 'Pago', 'Enviado', 'Cancelado'].map(s => `<option ${s === x.status ? 'selected' : ''}>${s}</option>`).join('')}</select><button class="btn ghost sm" data-act="odel" data-id="${esc(x.id)}">Excluir</button></div></div>`).join('') || '<p class="empty">Nenhum pedido ainda.</p>');
}
function adm(tab, body) {
  const pr = S.products, st = ATAB === tab && !body ? $('#admin').scrollTop : 0; ATAB = tab;
  $('#admin').innerHTML = `<div class="adm"><div class="ahead glass"><div class="row" style="justify-content:space-between;margin:0"><b>Painel ${esc(S.settings.brand)}</b><div class="row" style="margin:0"><button class="btn sm ${DIRTY ? 'dirty' : ''}" data-act="savall">Salvar alterações</button><button class="btn ghost sm" data-act="logout">Sair</button></div></div><div class="tabs">${TABS.map(([k, n]) => `<button class="pill ${k === tab ? 'on' : ''}" data-act="tab" data-t="${k}">${n}</button>`).join('')}</div></div><div id="ab"></div></div>`;
  const ab = $('#ab'), tb = $('.tabs'), on = $('.tabs .on'); tb.scrollLeft = on.offsetLeft - (tb.clientWidth - on.offsetWidth) / 2;
  if (body) body(ab);
  else if (tab === 'dash') ab.innerHTML = `<h2>Resumo</h2><div class="stats">${[['Produtos', pr.length], ['Disponíveis', pr.filter(p => p.available).length], ['Indisponíveis', pr.filter(p => !p.available).length], ['Categorias', S.categories.length]].map(([n, v]) => `<div class="stat"><b>${v}</b>${n}</div>`).join('')}</div><p class="mut" style="margin-top:20px">${useSB() ? 'Conectado ao Supabase: ao salvar, as alterações valem para todos.' : 'Supabase não configurado: os dados ficam só neste navegador.'}</p>`;
  else if (tab === 'prod') ab.innerHTML = `<div class="row"><button class="btn sm" data-act="pnew">Novo produto</button></div><h2>Produtos</h2>` + (pr.map(p => `<div class="item"><div class="g"><div class="t">${pic(p)}</div><div><b>${esc(p.name)}</b><p class="mut">${brl(price(p))} · ${p.active ? 'Visível' : 'Oculto'} · ${p.available ? 'Disponível' : 'Indisponível'}</p></div></div><div class="row">${[['pedit', 'Editar'], ['pdup', 'Duplicar'], ['ptog', p.active ? 'Desativar' : 'Ativar'], ['pav', p.available ? 'Marcar indisponível' : 'Reativar'], ['pdel', 'Excluir']].map(([a, n]) => `<button class="btn ghost sm" data-act="${a}" data-id="${p.id}">${n}</button>`).join('')}</div></div>`).join('') || '<p class="empty">Nenhum produto.</p>');
  else if (tab === 'cat') ab.innerHTML = `<div id="cn" class="row"><input style="padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:none" id="cname" placeholder="Nova categoria"><button class="btn sm" data-act="cadd">Criar</button></div><h2>Categorias</h2>` + S.categories.map(c => `<div class="item"><input data-cname="${c.id}" value="${esc(c.name)}" aria-label="Nome" style="background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px"><div class="row"><button class="btn ghost sm" data-act="cmv" data-id="${c.id}" data-d="-1">↑</button><button class="btn ghost sm" data-act="cmv" data-id="${c.id}" data-d="1">↓</button><button class="btn ghost sm" data-act="ctog" data-id="${c.id}">${c.active ? 'Desativar' : 'Ativar'}</button><button class="btn ghost sm" data-act="cdel" data-id="${c.id}">Excluir</button></div></div>`).join('');
  else if (tab === 'ord') { ab.innerHTML = '<h2>Pedidos</h2><p class="mut">Carregando...</p>'; loadOrders(); }
  else { editor(FIELDS[tab], S.settings, ab, null, '', W => { S.settings = { ...S.settings, ...W }; mark(); render(); }); if (tab === 'look') ab.insertAdjacentHTML('afterbegin', PREV); }
  $('#admin').scrollTop = st;
}
$('#admin').addEventListener('change', e => { const t = e.target; if (t.dataset.ost) Store.setOrder(ADMPASS, t.dataset.ost, t.value).then(() => toast('Status atualizado'), () => toast('Erro ao atualizar o pedido', 'err'));
  if (t.dataset.cname) { S.categories.find(c => c.id === t.dataset.cname).name = t.value.trim() || 'Sem nome'; mark(); render(); toast('Categoria atualizada'); } });
function adminActs() {
  const P_ = id => S.products.find(p => p.id === id), done = (tab, m) => { mark(); render(); adm(tab); m && toast(m); };
  const edit = p => adm('prod', ab => editor(prodFields(), p, ab, async W => { W.id ? Object.assign(P_(W.id), W) : S.products.unshift({ ...W, id: uid() }); await done('prod', 'Produto salvo'); }, '<button type="button" class="btn ghost" data-act="tab" data-t="prod">Cancelar</button>'));
  return {
    cadd: async () => { const n = $('#cname').value.trim(); if (!n) return toast('Digite o nome', 'err'); S.categories.push({ id: uid(), name: n, active: true }); mark(); render(); adm('cat'); toast('Categoria criada'); },
    logout: () => { const out = () => { ADMPASS = ''; ADM = false; $('#admin').classList.remove('on'); document.body.classList.remove('lock'); }; DIRTY ? ask('Há alterações não salvas. Sair e descartá-las?', async () => { S = await Store.load(); DIRTY = false; render(); out(); }) : out(); },
    tab: d => adm(d.t), pnew: () => edit(NEWP()), pedit: d => edit(P_(d.id)),
    pdup: d => { S.products.unshift({ ...structuredClone(P_(d.id)), id: uid(), name: P_(d.id).name + ' (cópia)' }); done('prod', 'Produto duplicado'); },
    ptog: d => { const p = P_(d.id); p.active = !p.active; done('prod'); }, pav: d => { const p = P_(d.id); p.available = !p.available; done('prod'); },
    pdel: d => ask('Excluir este produto?', () => { S.products = S.products.filter(p => p.id !== d.id); done('prod', 'Produto excluído'); }),
    ctog: d => { const c = S.categories.find(c => c.id === d.id); c.active = !c.active; done('cat'); },
    cdel: d => ask('Excluir esta categoria?', () => { S.categories = S.categories.filter(c => c.id !== d.id); if (F.c === d.id) F.c = 'all'; done('cat', 'Categoria excluída'); }),
    cmv: d => { const a = S.categories, i = a.findIndex(c => c.id === d.id), j = i + +d.d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; done('cat'); },
    odel: d => ask('Excluir este pedido?', async () => { try { await Store.setOrder(ADMPASS, d.id, '__delete'); toast('Pedido excluído'); loadOrders(); } catch { toast('Erro ao excluir', 'err'); } }),
    savall: async () => { if (await persist()) { DIRTY = false; const b = $('[data-act=savall]'); b && b.classList.remove('dirty'); toast('Alterações salvas'); } }
  };
}
const refresh = () => { document.documentElement.classList.add('rp'); requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove('rp'))); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
addEventListener('pageshow', refresh);
(async () => { S = await Store.load(); render(); if (Store.failed) toast('Não foi possível carregar os dados do Supabase: ' + Store.err, 'err'); })();
</script>
